name: CI

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['deltachat-mcpd-v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install .[dev]
      - run: pytest tests

  hermes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'mcp==2.0.0' 'httpx2==2.7.0'
      - run: python -m unittest discover -s hermes/tests -v

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: rustup toolchain install 1.96.1 --profile minimal
      - run: cargo +1.96.1 test --locked --all-targets --manifest-path rust/Cargo.toml
      - run: cargo +1.96.1 build --locked --release --manifest-path rust/Cargo.toml
      - name: Package exact Rust and native Core inputs
        run: |
          python -m pip download --no-deps --only-binary=:all: --require-hashes -r deploy/native-core.lock --dest "$RUNNER_TEMP/native"
          tag=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag=(--tag "$GITHUB_REF_NAME")
          fi
          rustup run 1.96.1 python deploy/pack-release.py --daemon rust/target/release/deltachat-mcpd \
            --native-wheel "$RUNNER_TEMP"/native/*.whl --output dist "${tag[@]}"
      - name: Start the packaged daemon with a real native Core
        run: |
          mkdir "$RUNNER_TEMP/deltachat-release"
          (cd dist && sha256sum -c deltachat-mcpd-linux-x86_64.tar.gz.sha256)
          tar -xzf dist/deltachat-mcpd-linux-x86_64.tar.gz -C "$RUNNER_TEMP/deltachat-release"
          python deploy/smoke-native.py "$RUNNER_TEMP/deltachat-release/bin/deltachat-mcpd" \
            "$RUNNER_TEMP/deltachat-release/bin/deltachat-rpc-server"
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: deltachat-mcpd-linux-x86_64
          path: dist/deltachat-mcpd-linux-x86_64.tar.gz*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref_type == 'tag'
    needs: [test, hermes, rust]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm tag is on the published main history
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@v4
        with:
          name: deltachat-mcpd-linux-x86_64
          path: dist
      - name: Publish the tested artifact
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c deltachat-mcpd-linux-x86_64.tar.gz.sha256
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes \
            deltachat-mcpd-linux-x86_64.tar.gz deltachat-mcpd-linux-x86_64.tar.gz.sha256
