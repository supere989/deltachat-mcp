[package]
name = "deltachat-mcpd"
version = "0.0.1"
edition = "2024"
description = "DeltaChat MCP server: dual-era Streamable HTTP (MCP 2026-07-28 + legacy initialize)"
license = "MIT"
publish = false

[dependencies]
rmcp = { version = "=3.11.0", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "sync", "time", "process", "io-util"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
