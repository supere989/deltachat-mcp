[project]
name = "deltachat-mcp"
version = "0.2.0"
description = "Model Context Protocol (MCP) server for Delta Chat — let AI send/receive encrypted messages"
authors = [{ name = "Your Name", email = "you@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deltachat2[full]>=2.58.0",
    "mcp>=2.3.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "black", "ruff"]

[project.scripts]
deltachat-mcp = "deltachat_mcp.server:main"
deltachat-setup = "configure:main"
deltachat-desktop = "desktop_setup:main"
deltachat-gui = "deltachat_mcp_gui:main"

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["deploy*", "hermes*", "rust*"]
